<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - TECHWORLD Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="topbar">⚡ GIAO HÀNG NHANH 2H TRONG NỘI THÀNH &nbsp;|&nbsp; ĐỔI 1 ĐỔI 0 TRONG 30 NGÀY</div>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">TECHWORLD<span>.</span></a>
            <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
            <nav class="main-nav" id="main-nav">
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="products.html">Sản phẩm</a></li>
                    <li><a href="cart.html">Giỏ hàng</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="user-area" id="user-area"></div>
                <a href="cart.html" class="cart-link">Giỏ hàng <span class="cart-badge">0</span></a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="auth-wrapper">
            <h2>Tạo tài khoản</h2>
            <p class="sub">Đăng ký để nhận nhiều ưu đãi hấp dẫn</p>

            <div class="alert" id="register-alert"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label>Họ và tên <span class="req">*</span></label>
                    <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A">
                    <div class="error-msg" id="fullname-error"></div>
                </div>
                <div class="form-group">
                    <label>Email <span class="req">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="email@example.com">
                    <div class="error-msg" id="email-error"></div>
                </div>
                <div class="form-group">
                    <label>Mật khẩu <span class="req">*</span> <small style="font-weight:400;color:var(--text-light)">(tối thiểu 6 ký tự)</small></label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••">
                    <div class="error-msg" id="password-error"></div>
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu <span class="req">*</span></label>
                    <input type="password" class="form-control" id="confirm-password" placeholder="••••••••">
                    <div class="error-msg" id="confirm-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">© 2026 TECHWORLD Store. Bài tập WEB1044 - Lập trình cơ sở với JavaScript.</div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
